name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Project test suites
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install data-pipeline dependencies
        working-directory: data_pipeline/node
        run: npm ci

      - name: Run Combat engine tests
        env:
          PYTHONPATH: Claude engine
        run: |
          python -m unittest discover \
            -s "Claude engine/tests" \
            -p "test_*.py" \
            -v

      - name: Run data-pipeline tests
        run: |
          python -m unittest discover \
            -s data_pipeline/tests \
            -p "test_*.py" \
            -v

      - name: Run Gemini adapter tests
        run: |
          python -m unittest discover \
            -s gemini \
            -p "test_adapter.py" \
            -v

      - name: Verify simulation reproducibility
        run: |
          python run_simulation.py \
            --roster data/gen9/engine/engine_roster.json \
            --count 24 \
            --seed 42 \
            --verify-repro
